[build-system]
requires = ["setuptools>=62.3"]
build-backend = "setuptools.build_meta"

[project]
name = "elica-connect-adapter"
version = "0.2.2"
authors = [{name = "ricfio"}]
description = "Elica Connect integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git"]
addopts = "--strict-markers --cov=custom_components/elica_connect_adapter"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["custom_components/elica_connect_adapter"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if False:", "raise NotImplementedError"]

[tool.black]
target-version = ["py312"]
line-length = 88
include = '\.pyi?$'
extend-exclude = "external"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["external", "tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[project.urls]
"Homepage" = "https://github.com/ricfio/elica-connect-adapter"
"Issue Tracker" = "https://github.com/ricfio/elica-connect-adapter/issues"
