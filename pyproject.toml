[build-system]
requires = ["setuptools>=62.3"]
build-backend = "setuptools.build_meta"

[project]
name = "elica-connect-ha"
version = "0.1.0"
authors = [{name = "ricfio"}]
description = "Elica Connect integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git"]
addopts = "--strict-markers --cov=custom_components/elica_connect_adapter"

[tool.coverage.run]
source = ["custom_components/elica_connect_adapter"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if False:", "raise NotImplementedError"]

[tool.black]
target-version = ["py310", "py311"]
line-length = 88
include = '\.pyi?$'
extend-exclude = "external"

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["custom_components.elica_connect_adapter"]

[project.urls]
"Homepage" = "https://github.com/ricfio/elica-connect-ha"
"Issue Tracker" = "https://github.com/ricfio/elica-connect-ha/issues"